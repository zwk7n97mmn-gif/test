name: コンテンツ検証

# 投稿できない文字数のコンテンツが本番に入るのを防ぐ。
# 豆知識を追加する PR は、必ずここを通してからマージする。
on:
  push:
    branches: ["**"]
    paths:
      - "content/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "content/**"
      - "src/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 独立実装との照合用に oauthlib を入れる
        # 本番コードは標準ライブラリのみで動く。これは署名の相互検証専用。
        run: pip install oauthlib

      - name: 全件の文字数・出典・重複を検証する
        run: python tests/validate.py --report

      - name: ロジックのテスト
        run: python tests/test_logic.py

      - name: 投稿内容を実際に組み立ててみる (投稿はしない)
        run: python src/post.py --dry-run
