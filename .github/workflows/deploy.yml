# GitHub Pages へ自動デプロイする（無料枠で完結）。
#
# これにより、利用者は PC を一切使わずに
# 「スマホでURLを開く → ホーム画面に追加」だけで使い始められる。
#
# 使い方:
#   1. リポジトリの Settings → Pages → Source を "GitHub Actions" にする
#   2. main（または既定ブランチ）に push する、もしくは Actions から手動実行する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限する（後から来たものを優先）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: テスト
        run: npm test

      - name: 姿勢推定モデルとアイコンを用意
        run: npm run setup

      - name: ビルド
        # リポジトリ名のサブパス配信になるため base を合わせる
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
