<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ／ホームインジケータ領域まで描画し、
         safe-area-inset-* で余白を確保する -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1f1c2b" />
    <meta
      name="description"
      content="音源のBPM・サビを解析し、動画から抽出したモーションを3Dキャラクターに適用して縦型ショート動画を作るツール。スマホだけで完結します。"
    />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Motion Muse" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <title>Motion Muse — 3Dダンス動画メーカー</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>このアプリケーションの利用には JavaScript が必要です。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
