name: AIに質問する
description: コードベース・仕様・実装方法などを AI に質問／相談したい場合に使用する。help-AI ラベルが付与されると AI が自動で返信する。
title: "[質問] 質問・相談の概要"
labels:
  - help-AI

body:
  - type: markdown
    attributes:
      value: |
        AI にコードベース調査を伴う回答を依頼するためのテンプレートです。

        このテンプレートから作成すると **`help-AI` ラベルが自動で付与**され、
        AI がコードベース・Wiki・設計書を調査して返信します。
        （返信後、`help-AI` ラベルは自動で外れます。**追加で質問したい場合は、コメントを投稿してから、
        再度 `help-AI` ラベルを付与**してください。ラベルを先に付けるとコメントを読まずに返信が始まることがあります）

        返信には 10〜20 分程度かかります。先に「調査中」のコメントが投稿され、完了時に同じコメントが返信内容へ書き換わります。

        回答の精度は入力情報の具体性に比例します。分かる範囲でできるだけ具体的に記入してください。

  - type: dropdown
    id: category
    attributes:
      label: 種別
      description: 質問の種類を選択してください。回答の主眼が変わります。
      options:
        - 質問 / 相談（仕様・使い方・実装意図・実装方法の確認）
        - 不具合報告（想定と異なる動作をする）
        - 機能要望 / 改善提案（こうしたい・こう変えたい）
        - その他 / 分類が難しい
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 質問・相談したいことを 1〜3 行で簡潔に記入してください。
      placeholder: 例）〇〇の画面で△△を実装したいが、既存のどの仕組みを使うのが適切か知りたい。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 対象・背景
      description: 関係する画面・機能・ファイル・テーブル等が分かれば記入してください。関連イシュー/PR は #123 の形式で参照できます。
      value: |
        - 対象の機能 / 画面:
        - 関連ファイル / テーブル（分かれば）:
        - 関連イシュー / PR（あれば）: #

  - type: textarea
    id: detail
    attributes:
      label: 詳細
      description: 種別に応じて、以下を参考に具体的に記入してください（不要な項目は削除可）。
      value: |
        ### 質問 / 相談の場合
        - 知りたいこと・確認したいこと:
        - 自分で調べた範囲・現時点の理解（あれば）:

        ### 不具合報告の場合
        - 再現手順:
          1.
        - 期待する動作:
        - 実際の動作（エラーメッセージ等があれば貼り付け）:

        ### 機能要望 / 改善提案の場合
        - 実現したいこと:
        - 現状の課題・そうしたい理由:

  - type: textarea
    id: others
    attributes:
      label: その他 / 補足
      description: 補足事項・スクリーンショット・制約条件などがあれば記入してください。
